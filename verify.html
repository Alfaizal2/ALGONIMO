<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ALGONIMO — Verify Certificate</title>
  <meta name="description" content="Verify an ALGONIMO course certificate using its unique Certificate ID or QR Code." />

  <style>
    :root{
      --bg:#071018; --card:#0f1720; --muted:#9aa4b2;
      --accent:#00ffe1; --accent2:#00a7ff; --text:#eaf6ff;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071018,#04121a);color:var(--text);font-family:Inter,system-ui,Arial;}
    header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;box-sizing:border-box;background:rgba(8,16,24,0.6);border-bottom:1px solid rgba(0,255,225,0.08);position:sticky;top:0;z-index:50;backdrop-filter:blur(6px);}
    .title{font-weight:700;color:var(--accent);letter-spacing:0.6px;}
    .small{font-size:13px;color:var(--muted);}
    .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:700;}
    .btn-ghost:hover{background:var(--accent);color:#000;}
    main{padding:36px 12px;display:flex;justify-content:center;align-items:flex-start;min-height:calc(100vh - 120px);}
    .card{width:100%;max-width:820px;background:var(--card);border-radius:14px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,0.6);border:1px solid rgba(0,255,225,0.08);text-align:center;}
    h1{margin:0 0 8px;color:var(--accent);font-size:1.6rem;}
    .muted{color:var(--muted);}
    input[type="text"]{width:100%;padding:12px 10px;background:#08141a;border:1px solid rgba(0,255,225,0.06);color:var(--text);border-radius:8px;font-size:1rem;outline:none;text-align:center;}
    .btn{margin-top:14px;background:var(--accent);color:#000;padding:10px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:700;}
    .btn:hover{background:var(--accent2);}
    .verified{color:var(--accent);font-weight:800;font-size:1.05rem;display:inline-flex;gap:8px;align-items:center;margin-top:6px;}
    .not-found{color:#ff7b7b;font-weight:800;font-size:1.05rem;margin-top:6px;}
    .cert-detail{text-align:left;margin-top:18px;color:var(--muted);line-height:1.7;border-top:1px dashed rgba(255,255,255,0.03);padding-top:14px;}
    .field{display:flex;justify-content:space-between;gap:10px;padding:6px 0;}
    .label{color:var(--muted);min-width:140px;}
    footer{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px;}
    a.clean{color:var(--accent);text-decoration:none;font-weight:700;}
    .user-status{color:var(--muted);font-weight:600;}
  </style>
</head>

<body>
  <header>
    <div>
      <div class="title">ALGONIMO Verify</div>
      <div class="small">Certificate verification</div>
    </div>

    <div style="display:flex;gap:12px;align-items:center;">
      <div id="authStatus" class="user-status">Not signed in</div>
      <button id="signInBtn" class="btn-ghost">Sign In</button>
      <button id="signOutBtn" class="btn-ghost" style="display:none">Sign Out</button>
      <button class="btn-ghost" onclick="location.href='certificate.html'">← Back</button>
    </div>
  </header>

  <main>
    <div class="card" role="region" aria-live="polite">
      <h1>Certificate Verification</h1>
      <p class="muted">Enter a Certificate ID (or open a QR that points to this page) to verify authenticity.</p>

      <label for="certInput" style="display:none">Certificate ID</label>
      <input id="certInput" type="text" placeholder="Enter Certificate ID (e.g. ALGON-VN18F8NW)" autocomplete="off" />

      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
        <button id="verifyBtn" class="btn">Verify Certificate</button>
        <button id="exampleBtn" class="btn-ghost">Show Example</button>
      </div>

      <div id="result" style="margin-top:20px;"></div>
    </div>
  </main>

  <footer>© 2025 ALGONIMO — Secure Verification System</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getFirestore, collection, query, where, limit, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    // Algonimo Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBJHDQ0QzPl5pFV8uP_6fHNIbL2TBmd4IY",
      authDomain: "algonimo.firebaseapp.com",
      projectId: "algonimo",
      storageBucket: "algonimo.appspot.com",
      messagingSenderId: "945219788815",
      appId: "1:945219788815:web:e3038de74f66aa58ea437a",
      measurementId: "G-R32HFZK10R"
    };

    // init
    let app;
    try { app = initializeApp(firebaseConfig); } catch (e) { console.warn("Firebase init:", e); }
    const db = getFirestore(app);
    const auth = getAuth(app);

    // DOM refs
    const certInput = document.getElementById('certInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const exampleBtn = document.getElementById('exampleBtn');
    const resultEl = document.getElementById('result');
    const authStatus = document.getElementById('authStatus');
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');

    function escapeHTML(s) {
      if (s === undefined || s === null) return "";
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'", "&#039;");
    }

    // Auth UI
    signInBtn.addEventListener('click', async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("Sign-in error:", err);
        alert("Sign-in failed: " + (err?.message || "Try again"));
      }
    });
    signOutBtn.addEventListener('click', async () => {
      try { await signOut(auth); } catch (err) { console.error("Sign-out error:", err); }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authStatus.textContent = `Signed in: ${user.displayName || user.email}`;
        signInBtn.style.display = 'none';
        signOutBtn.style.display = 'inline-block';
      } else {
        authStatus.textContent = 'Not signed in';
        signInBtn.style.display = 'inline-block';
        signOutBtn.style.display = 'none';
      }
    });

    // read cert param from URL
    (function checkURLParam(){
      try {
        const p = new URLSearchParams(window.location.search);
        const c = p.get('cert');
        if (c) { certInput.value = c; verifyCertificate(c); }
      } catch(e){ console.warn("url param parse failed", e); }
    })();

    verifyBtn.addEventListener('click', () => {
      const id = (certInput.value || "").trim();
      if (!id) { resultEl.innerHTML = `<div class="muted">Please enter a certificate ID to verify.</div>`; return; }
      verifyCertificate(id);
    });

    exampleBtn.addEventListener('click', () => {
      const exampleID = "ALGON-EXAMPLE1";
      certInput.value = exampleID;
      verifyCertificate(exampleID);
    });

    function prettyDate(input) {
      if (!input) return "—";
      try {
        const d = new Date(input);
        if (!isNaN(d.getTime())) return d.toLocaleDateString();
      } catch(e){}
      return String(input);
    }

    // Enhanced extractor for exact certificate name/email fields (including certName/certificateName)
    function extractExactNameEmail(doc = {}, trace = null) {
      // prefer explicit certificate name fields
      const certNameCandidates = ['certName','certificateName','certificate_name','cert_name','name','displayName','fullName','full_name','full_name_display','username','userName'];
      const certEmailCandidates = ['email','emailAddress','email_address','contactEmail','contact_email','userEmail','contact'];

      let foundName = null;
      let foundEmail = null;

      for (const k of certNameCandidates) {
        if (!foundName && doc[k] && typeof doc[k] === 'string' && doc[k].trim().length > 0) {
          foundName = doc[k].trim();
        }
      }

      for (const k of certEmailCandidates) {
        if (!foundEmail && doc[k]) {
          const v = doc[k];
          if (typeof v === 'string' && v.includes('@')) foundEmail = v.trim();
          else if (typeof v === 'object' && v.email && typeof v.email === 'string') foundEmail = v.email.trim();
        }
      }

      // search top-level values more widely
      for (const [k,v] of Object.entries(doc)) {
        if (!foundEmail && typeof v === 'string' && v.includes('@')) foundEmail = v.trim();
        if (!foundName && typeof v === 'string' && v.trim().length >= 2 && !v.includes('@')) {
          // avoid picking fields that look like ids; prefer ones with letters/spaces
          if (/[a-zA-Z]/.test(v)) foundName = v.trim();
        }
      }

      // check one-level nested structures (profile: { name/email })
      for (const v of Object.values(doc)) {
        if (foundName && foundEmail) break;
        if (v && typeof v === 'object') {
          for (const [k2,v2] of Object.entries(v)) {
            if (!foundEmail && typeof v2 === 'string' && v2.includes('@')) foundEmail = v2.trim();
            if (!foundName && typeof v2 === 'string' && v2.trim().length >= 2 && /[a-zA-Z]/.test(v2)) foundName = v2.trim();
          }
        }
      }

      // fallback to trace actor when it's an email-like string
      if (!foundEmail && trace && trace.actor && typeof trace.actor === 'string' && trace.actor.includes('@')) {
        foundEmail = trace.actor.trim();
      }

      return { name: foundName || null, email: foundEmail || null };
    }

    // Main verification
    async function verifyCertificate(certID) {
      resultEl.innerHTML = `<div class="muted">Verifying certificate <strong>${escapeHTML(certID)}</strong>…</div>`;

      try {
        // 1) Try users collection for certificateID
        const usersCol = collection(db, 'users');
        const uq = query(usersCol, where('certificateID','==', certID), limit(1));
        const usnap = await getDocs(uq);

        if (!usnap.empty) {
          const udocSnap = usnap.docs[0];
          const data = udocSnap.data() || {};
          const uid = udocSnap.id;

          // extract exact fields
          const extracted = extractExactNameEmail(data, null);
          let holderName = extracted.name;
          let holderEmail = extracted.email;

          // If cert page stored a dedicated 'certName' prefer that; if not derive name from email local-part
          if (!holderName && holderEmail) {
            holderName = holderEmail.split('@')[0].replace(/[._\-]/g,' ').replace(/\b\w/g, c => c.toUpperCase());
          }

          // final fallbacks
          if (!holderName) {
            if (data.username) holderName = data.username;
            else holderName = `User-${String(uid).slice(0,6)}`;
          }
          if (!holderEmail) holderEmail = data.email || "—";

          const program = data.program || "C Mastery Program";
          const issued = data.issuedDate || data.issued || "Not recorded";

          renderVerified({ certID, holderName, holderEmail, program, issued, uid });
          return;
        }

        // 2) Fallback: traces collection for issuance record
        const tracesCol = collection(db, 'traces');
        const tq = query(tracesCol, where('type','==','issue_certificate'), where('certificateID','==', certID), limit(1));
        const tsnap = await getDocs(tq);

        if (!tsnap.empty) {
          const traceDoc = tsnap.docs[0];
          const tdata = traceDoc.data() || {};

          // if trace points to a uid, fetch that user doc for exact info
          if (tdata.uid) {
            try {
              const userRef = doc(db, 'users', tdata.uid);
              const udoc = await getDoc(userRef);
              if (udoc.exists()) {
                const udata = udoc.data() || {};
                const extracted = extractExactNameEmail(udata, tdata);
                let holderName = extracted.name;
                let holderEmail = extracted.email;

                if (!holderName && holderEmail) {
                  holderName = holderEmail.split('@')[0].replace(/[._\-]/g,' ').replace(/\b\w/g, c => c.toUpperCase());
                }
                if (!holderName) holderName = udata.username || `User-${String(tdata.uid).slice(0,6)}`;
                if (!holderEmail) holderEmail = tdata.actor || udata.email || "—";

                const program = udata.program || "C Mastery Program";
                const issued = udata.issuedDate || tdata.issuedDate || tdata.ts || "Recorded";

                renderVerified({ certID, holderName, holderEmail, program, issued, uid: tdata.uid });
                return;
              }
            } catch (e) {
              console.warn("fetch user by uid failed", e);
            }
          }

          // trace-only (no user doc available)
          const actor = tdata.actor || tdata.uid || "System";
          renderTraceOnly({ certID, actor, issued: tdata.issuedDate || tdata.ts || "Recorded" });
          return;
        }

        // not found anywhere
        resultEl.innerHTML = `
          <div class="not-found">❌ Invalid or Unknown Certificate ID</div>
          <p class="muted" style="margin-top:12px;">No record was found for <strong>${escapeHTML(certID)}</strong>.</p>
          <div style="margin-top:14px;">
            <button class="btn" onclick="location.href='certificate.html'">Back to Certificate</button>
            <a class="clean" href="mailto:admin@algonimo.web.app?subject=Certificate%20Not%20Found%20${encodeURIComponent(certID)}" style="margin-left:12px;">Ask Admin</a>
          </div>
        `;
      } catch (err) {
        console.error("Verification error:", err);
        resultEl.innerHTML = `<div class="not-found">⚠️ Error verifying certificate. Try again later.</div>`;
      }
    }

    // render helpers
    function renderVerified({ certID, holderName, holderEmail, program, issued, uid }) {
      resultEl.innerHTML = `
        <div class="verified">✅ Verified Certificate</div>
        <h2 style="margin-top:10px;">${escapeHTML((holderName||"UNNAMED").toUpperCase())}</h2>
        <div class="cert-detail" role="article" aria-label="Certificate details">
          <div class="field"><div class="label"><strong>Certificate ID:</strong></div><div>${escapeHTML(certID)}</div></div>
          <div class="field"><div class="label">Program:</div><div>${escapeHTML(program)}</div></div>
          <div class="field"><div class="label">Issued By:</div><div>ALGONIMO Certification Authority</div></div>
          <div class="field"><div class="label">Issued Date:</div><div>${escapeHTML(prettyDate(issued))}</div></div>
          <div class="field"><div class="label">Status:</div><div>VALID ✔</div></div>
        </div>

        <div style="margin-top:14px;">
          <button class="btn" onclick="location.href='certificate.html'">Back to Certificate</button>
          <a class="clean" href="mailto:admin@algonimo.web.app?subject=Verify%20Certificate%20${encodeURIComponent(certID)}" style="margin-left:12px;">Contact Admin</a>
        </div>
      `;
    }

    function renderTraceOnly({ certID, actor, issued }) {
      resultEl.innerHTML = `
        <div class="verified">✅ Found Issuance Trace</div>
        <h2 style="margin-top:10px;">${escapeHTML(String(actor).toUpperCase())}</h2>
        <div class="cert-detail">
          <div class="field"><div class="label"><strong>Certificate ID:</strong></div><div>${escapeHTML(certID)}</div></div>
          <div class="field"><div class="label">Program:</div><div>C Mastery Program</div></div>
          <div class="field"><div class="label">Issued By:</div><div>ALGONIMO Certification Authority</div></div>
          <div class="field"><div class="label">Issued Date (trace):</div><div>${escapeHTML(prettyDate(issued))}</div></div>
          <div class="field"><div class="label">Recorded By (trace):</div><div>${escapeHTML(actor)}</div></div>
          <div class="field"><div class="label">Status:</div><div>VALID (trace) ✔</div></div>
        </div>

        <div style="margin-top:14px;">
          <button class="btn" onclick="location.href='certificate.html'">Back to Certificate</button>
          <a class="clean" href="mailto:admin@algonimo.web.app?subject=Verify%20Certificate%20${encodeURIComponent(certID)}" style="margin-left:12px;">Contact Admin</a>
        </div>
      `;
    }

  </script>
</body>
</html>
