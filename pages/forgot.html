<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password – Algonimo</title>

  <link rel="stylesheet" href="../assets/page css/forgot.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>

  <section class="forgot-box">
    <h1>Reset Password 🔐</h1>
    <p>Enter your registered email to reset your password.</p>

    <input type="email" id="fpEmail" placeholder="Enter your email">

    <div id="newPassSection" style="display:none;">
      <input type="password" id="fpNewPass" placeholder="Enter new password">
    </div>

    <button id="fpBtn">Continue</button>

    <a href="../pages/login.html" class="back-link">Back to Login</a>
  </section>

  <script src="../assets/js/forgot.js"></script>
</body>
</html>
