<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup | ALGONIMO</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/page css/signup.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body>

    <!-- =========== OPTIONAL: Auto redirect if logged in =========== -->
    <script>
      if (localStorage.getItem("alg_user_logged_in") === "true") {
        window.location.href = "dashboard.html";
      }
    </script>

    <!-- === POPUP MESSAGE === -->
    <div id="popupNotification" class="popup-notification">
      <p id="popupMessage"></p>
    </div>

    <!-- === MAIN CONTAINER === -->
    <div class="container">

      <!-- LOGIN FORM -->
      <div class="form-box login animate">
        <form id="loginForm">
          <h1>Login</h1>

          <div class="input-box">
            <input type="email" id="loginEmail" placeholder="Email" required />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input type="password" id="loginPassword" placeholder="Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>

          <div class="forgot-link">
            <a href="#" id="forgotPasswordBtn">Forgot Password?</a>
          </div>

          <button type="submit" class="btn">Login</button>

          <p style="margin: 10px 0; color: #a0a0a0;">or continue with</p>

          <!-- GOOGLE LOGIN -->
          <button type="button" class="google-btn" id="googleLoginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google logo"
              class="google-icon" />
          </button>

        </form>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-box register animate">
        <form id="registerForm">
          <h1>Sign Up</h1>

          <div class="input-box">
            <input type="text" id="regUsername" placeholder="Username" required />
            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input type="email" id="regEmail" placeholder="Email" required />
            <i class="bx bxs-envelope"></i>
          </div>

          <div class="input-box">
            <input type="password" id="regPassword" placeholder="Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>

          <div class="input-box">
            <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required />
            <i class="bx bxs-lock-alt"></i>
          </div>

          <button type="submit" class="btn">Register</button>

          <p style="margin: 10px 0; color: #a0a0a0;">or sign up with</p>

          <!-- GOOGLE SIGNUP -->
          <button type="button" class="google-btn" id="googleSignupBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google logo"
              class="google-icon" />
          </button>

        </form>
      </div>

      <!-- TOGGLE BOX -->
      <div class="toggle-box">
        <div class="toggle-panel toggle-left">
          <h1>Hello, Learner!</h1>
          <p>Don’t have an account?</p>
          <button type="button" class="btn register-btn">Register</button>
        </div>

        <div class="toggle-panel toggle-right">
          <h1>Welcome Back!</h1>
          <p>Already have an account?</p>
          <button type="button" class="btn login-btn">Login</button>
        </div>
      </div>

    </div>

    <!-- ========== MUST BE FIRST ========== -->
    <script type="module" src="../assets/js/auth.js"></script>

    <!-- ========== Your login/signup logic ========== -->
    <script type="module" src="../assets/js/signup.js"></script>

  </body>
</html>
